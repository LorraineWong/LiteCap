name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! 中文或英文都可以。
        LiteCap aims to stay small, fast and offline — see the design principles in CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation first, e.g. "I often need to capture a long web page for a ticket…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like LiteCap to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead? (optional)
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to help build or test this
